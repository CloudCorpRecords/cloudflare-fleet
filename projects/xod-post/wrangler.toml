# Xod Post Office on Cloudflare Workers (free tier is plenty for a personal or small-team relay).
#   npm install
#   npx wrangler login
#   npx wrangler d1 create xod-post          # paste the database_id it prints below
#   npx wrangler d1 execute xod-post --remote --file schema.sql
#   npx wrangler deploy
# Then point a domain at it (Workers → your worker → Settings → Domains), set DOMAIN to that
# domain, and deploy again. Addresses become name@DOMAIN.
name = "xod-post"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
DOMAIN = "xod-post.xod-post.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "xod-post"
database_id = "75517640-d526-4377-a06f-74680890e1eb"
